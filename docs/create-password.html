<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IEABank · Create account</title>

  <style>
    :root {
      --iea-red: #E2231A;
      --iea-gray: #54565A;
      --page-bg: #f5f5f5;
      --border: #d9d9d9;
      --success: #16753a;
      --error: #b00020;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--page-bg);
      color: var(--iea-gray);
    }

    .card {
      width: calc(100% - 28px);
      max-width: 460px;
      margin: 60px auto;
      padding: 32px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 1.5rem;
      color: var(--iea-gray);
    }

    .subtitle {
      margin: 0 0 24px;
      text-align: center;
      line-height: 1.45;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 1rem;
    }

    input:focus {
      outline: 2px solid rgba(226, 35, 26, .18);
      border-color: var(--iea-red);
    }

    button,
    .app-link {
      display: block;
      width: 100%;
      padding: 11px 14px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }

    button {
      margin-top: 24px;
      border: 0;
      background: var(--iea-red);
      color: #fff;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: default;
    }

    .app-link {
      margin-top: 12px;
      border: 2px solid var(--iea-red);
      background: #fff;
      color: var(--iea-red);
    }

    .app-link.primary {
      background: var(--iea-red);
      color: #fff;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      line-height: 1.45;
    }

    .error {
      color: var(--error);
    }

    .success {
      color: var(--success);
    }

    #destination-panel {
      display: none;
      margin-top: 24px;
    }

    .destination-title {
      margin: 0 0 10px;
      text-align: center;
      font-weight: 700;
    }

    .small-note {
      margin: 14px 0 0;
      text-align: center;
      font-size: .9rem;
      color: #777;
      line-height: 1.4;
    }

    @media (max-width: 520px) {
      .card {
        margin: 24px auto;
        padding: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>IEABank Portal</h1>
    <p class="subtitle">Create your IEABank account.</p>

    <form id="registration-form">
      <label for="first-name">First name</label>
      <input id="first-name" type="text" autocomplete="given-name" required>

      <label for="last-name">Last name</label>
      <input id="last-name" type="text" autocomplete="family-name" required>

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password" minlength="8" autocomplete="new-password" required>

      <label for="password-confirm">Confirm password</label>
      <input id="password-confirm" type="password" minlength="8" autocomplete="new-password" required>

      <button id="submit-btn" type="submit">Create account</button>
    </form>

    <div id="message"></div>

    <section id="destination-panel">
      <p class="destination-title">Your account is ready. Choose where to continue:</p>

      <a
        class="app-link primary"
        href="https://019ef681-aa4c-c11a-bc64-21ec4808917b.share.connect.posit.cloud/"
      >
        Admin GUI
      </a>

      <a
        class="app-link"
        href="https://01a03ecf-4c32-a562-58b9-3355cdb9e663.share.connect.posit.cloud/"
      >
        User GUI
      </a>

      <p class="small-note">
        Sign in using the email address and password you just created.
      </p>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://ejmtcftpafwhgjbdgajh.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_VarHbYpEIhc7lJ07Up-Idg_pPduzoI7";

    const params = new URLSearchParams(window.location.search);
    const registrationCode = params.get("register");

    const form = document.getElementById("registration-form");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submit-btn");
    const destinationPanel = document.getElementById("destination-panel");

    function showMessage(text, type = "") {
      message.textContent = text;
      message.className = type;
    }

    if (!registrationCode || registrationCode.length < 20) {
      form.style.display = "none";
      showMessage(
        "This registration link is invalid or incomplete. Please request a new IEABank registration link.",
        "error"
      );
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const firstName = document.getElementById("first-name").value.trim();
      const lastName = document.getElementById("last-name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("password-confirm").value;

      if (!firstName || !lastName || !email) {
        showMessage("Please complete all fields.", "error");
        return;
      }

      if (password.length < 8) {
        showMessage("Your password must contain at least 8 characters.", "error");
        return;
      }

      if (password !== confirmPassword) {
        showMessage("The passwords do not match.", "error");
        return;
      }

      submitButton.disabled = true;
      showMessage("Creating your account...");

      try {
        const response = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
          method: "POST",
          headers: {
            "apikey": SUPABASE_PUBLISHABLE_KEY,
            "Authorization": `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email: email,
            password: password,
            data: {
              first_name: firstName,
              last_name: lastName,
              registration_code: registrationCode
            }
          })
        });

        const body = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(
            body.msg ||
            body.message ||
            body.error_description ||
            "It was not possible to create the account."
          );
        }

        form.style.display = "none";

        if (body.access_token) {
          showMessage("Account created successfully.", "success");
          destinationPanel.style.display = "block";
        } else {
          showMessage(
            "Account created. Please check your email to confirm your address before signing in.",
            "success"
          );
          destinationPanel.style.display = "block";
        }
      } catch (error) {
        showMessage(
          error.message || "It was not possible to create the account.",
          "error"
        );
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
